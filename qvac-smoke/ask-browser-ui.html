<!doctype html>
<html lang="en">
<head>

  <title>Ask Browser UI Smoke</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { margin: 0; min-height: 100vh; background: #f4f7f5; }

    .smoke-page { min-width: 0; flex: 1; padding: 48px; overflow: auto; }
