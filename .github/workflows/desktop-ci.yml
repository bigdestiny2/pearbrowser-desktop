name: Desktop CI

"on":
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  desktop:
    name: Desktop tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PearBrowser desktop
        uses: actions/checkout@v4
        with:
          path: pear-ecosystem/01-browser/pearbrowser-desktop

      - name: Checkout PearBrowser mobile source contracts
        uses: actions/checkout@v4
        with:
          repository: bigdestiny2/PearBrowser
          ref: de85d420c942d433905324c3e098acc34458a23a
          path: pear-ecosystem/01-browser/PearBrowser

      - name: Checkout HiveRelay workspace packages
        uses: actions/checkout@v4
        with:
          repository: bigdestiny2/P2P-Hiverelay
          ref: v0.20.2
          path: pear-ecosystem/00-core/hiverelay

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pear-ecosystem/01-browser/pearbrowser-desktop/package-lock.json

      - name: Guard HiveRelay 0.20.2 workspace layout
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs')
          const { resolve } = require('node:path')

          const expected = [
            ['p2p-hiverelay', '0.20.2', 'pear-ecosystem/00-core/hiverelay/packages/core/package.json'],
            ['p2p-hiverelay-client', '0.20.2', 'pear-ecosystem/00-core/hiverelay/packages/client/package.json'],
            ['p2p-hiverelay-verifier', '0.20.2', 'pear-ecosystem/00-core/hiverelay/packages/verifier/package.json']
          ]

          const errors = []

          for (const [name, version, rel] of expected) {
            try {
              const pkgPath = resolve(process.cwd(), rel)
              const pkg = JSON.parse(readFileSync(pkgPath, 'utf8'))
              if (pkg.name !== name || pkg.version !== version) {
                errors.push(`${rel}: expected ${name}@${version}, found ${pkg.name || '(missing name)'}@${pkg.version || '(missing version)'}`)
              }
            } catch (err) {
              errors.push(`${rel}: ${err.message}`)
            }
          }

          if (errors.length) {
            console.error('HiveRelay checkout no longer matches the documented 0.20.2 workspace layout.')
            console.error('Expected packages under pear-ecosystem/00-core/hiverelay/packages/{core,client,verifier}.')
            for (const error of errors) console.error(`- ${error}`)
            process.exit(1)
          }
          NODE

      - name: Verify HiveRelay layout
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: node scripts/check-hiverelay-layout.mjs

      - name: Install
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: npm ci

      - name: Test
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: npm test

      - name: Audit high severity dependencies
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: npm audit --audit-level=high

      - name: Capture Desktop CI evidence
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: npm run evidence:desktop:ci
