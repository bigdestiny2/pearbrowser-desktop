name: Desktop CI

"on":
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  desktop:
    name: Desktop tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PearBrowser desktop
        uses: actions/checkout@v4
        with:
          path: pear-ecosystem/01-browser/pearbrowser-desktop

      - name: Checkout HiveRelay workspace packages
        uses: actions/checkout@v4
        with:
          repository: bigdestiny2/P2P-Hiverelay
          ref: v0.16.3
          path: pear-ecosystem/00-core/hiverelay

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pear-ecosystem/01-browser/pearbrowser-desktop/package-lock.json

      - name: Verify HiveRelay layout
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: node scripts/check-hiverelay-layout.mjs

      - name: Install
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: npm ci

      - name: Test
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: npm test

      - name: Audit high severity dependencies
        working-directory: pear-ecosystem/01-browser/pearbrowser-desktop
        run: npm audit --audit-level=high
